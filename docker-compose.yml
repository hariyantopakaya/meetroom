version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking_meeting_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=${APP_URL:-http://localhost:3000}
      - DATABASE_URL=${DATABASE_URL:-file:./data/prod.db}
      - JWT_SECRET=${JWT_SECRET:-production_secure_jwt_secret_booking_meeting_2026}
      - JWT_EXPIRES_IN=7d
      - COOKIE_SECRET=${COOKIE_SECRET:-production_cookie_secret_booking_meeting_2026}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-Booking Meeting <no-reply@bookingmeeting.local>}
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app_data:
    name: booking_meeting_app_data
